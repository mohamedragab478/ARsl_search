[project]
name = "ARsl_search"
version = "0.1.0"
description = "Arabic Sign Language Search System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "imageio>=2.37.3",
    "numpy>=2.4.4",
    "opencv-python>=4.13.0.92",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "sentence-transformers>=5.5.0",
    "torch>=2.11.0",
    "transformers>=5.8.1",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.9",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
